trigger:
  - main

pool:
  ##vmImage: ubuntu-latest
  vmImage: 'windows-2022'
  
variables:
     POLARIS_SERVER_URL: $(POLARIS_SERVER_URL)
     POLARIS_ACCESS_TOKEN: $(POLARIS_ACCESS_TOKEN)
steps:
    - task: NuGetToolInstaller@1
      displayName: 'Install NuGet CLI'
      inputs:
        versionSpec: '6.x'

    - task: PowerShell@2
      displayName: 'nuget restore (generates obj/nuget.g.props for .NET Framework PackageReference)'
      inputs:
        targetType: 'inline'
        script: |
          nuget restore src\DummyLib\DummyLib.csproj -Verbosity detailed

    - task: PowerShell@2
      displayName: 'Remove project.assets.json to force nuget.g.props code path'
      inputs:
        targetType: 'inline'
        script: |
          $assets = Get-ChildItem -Path . -Recurse -Filter "project.assets.json" -ErrorAction SilentlyContinue
          foreach ($f in $assets) {
            Write-Host "Removing: $($f.FullName)"
            Remove-Item $f.FullName -Force
          }

    - task: JavaToolInstaller@0
      displayName: 'Use Java 17 (OpenJDK 64-bit)'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: BlackDuckSecurityScan@2
      inputs:
        scanType: 'polaris'
        polarisServerUrl: 'https://poc.polaris.blackduck.com'
        polarisAccessToken: 'rvb1uibn0h59d9e6tnba154881gop03fidu4n0kn6nl8spfgdhe9rtjebb63p1dhfk89so4u0i2v0'
        polarisAssessmentTypes: 'SCA'
        polarisTestScaType: 'SCA-PACKAGE'
        polarisApplicationName: 'norm_test'
        polarisProjectName: 'BridgeTest'
        polarisBranchName: 'main'
        polarisIncludeDiagnostics: true